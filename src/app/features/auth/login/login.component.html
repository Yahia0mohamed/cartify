<div
  class="w-full h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 p-4">
  <div class="w-full max-w-md">
    <form [formGroup]="form" (ngSubmit)="submit()"
      class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden relative">

      <!-- Gradient Border -->
      <div class="absolute inset-0 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 p-0.5 rounded-3xl">
        <div class="bg-white rounded-3xl h-full w-full"></div>
      </div>

      <!-- Form Content -->
      <div class="relative p-8 md:p-10">
        <!-- Header -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center gap-3 mb-4">
            <div class="p-3 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl text-white">
              <fa-icon icon="cart-shopping" class="text-2xl"></fa-icon>
            </div>
            <h2 class="text-3xl font-black bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
              Store
            </h2>
          </div>
          <h3 class="text-2xl font-bold text-slate-800 mb-2">Welcome Back</h3>
          <p class="text-slate-600">Sign in to your account</p>
        </div>

        <!-- Username Field -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-slate-700 mb-2">
            Username
          </label>
          <div class="relative">
            <fa-icon icon="user" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></fa-icon>
            <input formControlName="username" type="text"
              class="w-full pl-12 pr-4 py-4 border-2 rounded-xl focus:outline-none transition-all duration-300 bg-slate-50 focus:bg-white focus:border-blue-500 focus:shadow-lg"
              [ngClass]="failedToLogin ? 'border-red-500 bg-red-50' : 'border-slate-200'"
              placeholder="Enter your username" />
          </div>
        </div>

        <!-- Password Field -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-slate-700 mb-2">
            Password
          </label>
          <div class="relative">
            <fa-icon icon="lock" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></fa-icon>
            <input formControlName="password" type="password"
              class="w-full pl-12 pr-4 py-4 border-2 rounded-xl focus:outline-none transition-all duration-300 bg-slate-50 focus:bg-white focus:border-blue-500 focus:shadow-lg"
              [ngClass]="failedToLogin ? 'border-red-500 bg-red-50' : 'border-slate-200'"
              placeholder="Enter your password" />
          </div>
        </div>

        <!-- Register Link -->
        <p class="text-center text-sm mb-6">
          <span class="text-slate-600">Don't have an account? </span>
          <span class="text-blue-600 hover:text-blue-800 font-bold cursor-pointer transition-colors"
            (click)="goToRegister()">
            Register now!
          </span>
        </p>

        <!-- Submit Button -->
        <button type="submit"
          class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-4 rounded-xl font-bold text-lg hover:from-blue-600 hover:to-purple-700 transition-all duration-300 hover:shadow-xl transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300">
          <fa-icon icon="sign-in-alt" class="mr-2"></fa-icon>
          Sign In
        </button>

        <!-- Error Message -->
        <div *ngIf="failedToLogin" class="mt-4 p-4 bg-red-50 border-l-4 border-red-500 rounded-lg">
          <div class="flex items-center">
            <fa-icon icon="exclamation-triangle" class="text-red-500 mr-2"></fa-icon>
            <p class="text-red-700 font-medium">
              Invalid username or password. Please try again.
            </p>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
