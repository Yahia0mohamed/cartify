<div (click)="onCardClick()"
    class="group relative bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-xl transition-all duration-500 hover:-translate-y-2 cursor-pointer border border-slate-200">
    <!-- Hover gradient overlay -->
    <div
        class="absolute inset-0 bg-gradient-to-br from-blue-50/70 to-purple-50/70 opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0">
    </div>

    <!-- Product Image -->
    <div class="relative overflow-hidden">
        <img [src]="product.image" [alt]="product.title"
            class="w-full h-56 object-cover group-hover:scale-105 transition-transform duration-500" />
    </div>

    <!-- Product Info -->
    <div class="p-6 relative z-10 flex flex-col h-full">
        <!-- Title -->
        <h2
            class="font-semibold text-lg md:text-xl mb-2 text-slate-800 group-hover:text-blue-600 transition-colors line-clamp-2">
            {{ product.getShortName() }}
        </h2>

        <!-- Category -->
        <p class="text-slate-500 text-xs mb-3 uppercase tracking-wider">
            {{ product.category }}
        </p>

        <!-- Price -->
        <p
            class="font-extrabold text-2xl md:text-3xl text-transparent bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text mb-6">
            ${{ product.getFormatedPrice() }}
        </p>

        <!-- Add to Cart Button -->
        <button
            class="mt-auto w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-xl font-semibold opacity-0 group-hover:opacity-100 transform translate-y-3 group-hover:translate-y-0 transition-all duration-300 hover:from-blue-600 hover:to-purple-700 hover:shadow-md">
            <fa-icon icon="cart-plus" class="mr-2"></fa-icon>
            Add to Cart
        </button>
    </div>
</div>
