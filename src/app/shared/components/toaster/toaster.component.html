<div *ngIf="toast" class="fixed top-5 right-5 px-4 py-2 rounded-md shadow-lg text-white z-50 transition" [ngClass]="{
        'bg-green-500': toast.type === 'success',
        'bg-red-500': toast.type === 'error',
        'bg-blue-500': toast.type === 'info',
        'bg-yellow-500': toast.type === 'warning'
     }">
    {{ toast.message }}
</div>
